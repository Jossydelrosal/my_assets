name: Assemble N5 course

on:
  push:
    branches: [feature/marble-courses]
    paths: [.tmp/n5-final-ready]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/marble-courses
      - name: Add Japanese Lessons 3 and 4
        run: |
          python - <<'PY'
          import json
          p = "courses/japanese-jlpt-n5/course.json"
          with open(p, encoding="utf-8") as f: c = json.load(f)
          assert c["course_id"] == "japanese-jlpt-n5"
          assert (len(c["cards"]), len(c["grammar"]), len(c["sentences"])) == (25, 8, 25)
          base = ["course:japanese", "jlpt:N5"]
          def card(i,t,r,e,d,tags,s=None,sr=None,st=None):
              x={"id":i,"target":t,"target_furigana":r,"english_word":e,"definition":d,"tags":base+tags}
              if s: x.update(sentence=s,sentence_furigana=sr or s,sentence_translation=st or "")
              return x
          # Reuse existing vocabulary when later lessons teach it again.
          byid={x["id"]:x for x in c["cards"]}
          for i in ["word-nihon","word-chuugoku","word-mekishiko","word-amerika","word-dokono-hito"]:
              if "lesson:3" not in byid[i]["tags"]: byid[i]["tags"].append("lesson:3")
          for i in ["word-gakusei","word-dare"]:
              if "lesson:4" not in byid[i]["tags"]: byid[i]["tags"].append("lesson:4")
          c["cards"] += [
            card("word-shusshin","出身","しゅっしん","hometown; place of origin","The place someone is from.",["lesson:3","origin"],"マリアさんはグアダラハラ出身です。","マリアさんはグアダラハラしゅっしんです。","Maria is from Guadalajara."),
            card("word-doko","どこ","どこ","where","A question word asking about a place.",["lesson:3","question","place"],"シドニーはどこにありますか。",None,"Where is Sydney?"),
            card("word-guadalajara","グアダラハラ","グアダラハラ","Guadalajara","Guadalajara, Maria's hometown in the lesson.",["lesson:3","city"],"グアダラハラはメキシコにあります。",None,"Guadalajara is in Mexico."),
            card("word-sydney","シドニー","シドニー","Sydney","Sydney, Anna's hometown in the lesson.",["lesson:3","city"],"シドニーはオーストラリアにあります。",None,"Sydney is in Australia."),
            card("word-australia","オーストラリア","オーストラリア","Australia","Australia.",["lesson:3","country"],"シドニーはオーストラリアにあります。",None,"Sydney is in Australia."),
            card("word-tokyo","東京","とうきょう","Tokyo","Tokyo.",["lesson:3","city"],"東京は日本にあります。","とうきょうはにほんにあります。","Tokyo is in Japan."),
            card("word-paris","パリ","パリ","Paris","Paris.",["lesson:3","city"]),
            card("word-rome","ローマ","ローマ","Rome","Rome.",["lesson:3","city"]),
            card("word-shanghai","上海","しゃんはい","Shanghai","Shanghai.",["lesson:3","city"]),
            card("word-kyoto","京都","きょうと","Kyoto","Kyoto.",["lesson:3","city"]),
            card("word-london","ロンドン","ロンドン","London","London.",["lesson:3","city"]),
            card("word-new-york","ニューヨーク","ニューヨーク","New York","New York.",["lesson:3","city"]),
            card("word-uk","イギリス","イギリス","United Kingdom; Britain","The United Kingdom / Britain.",["lesson:3","country"]),
            card("word-italy","イタリア","イタリア","Italy","Italy.",["lesson:3","country"]),
            card("word-france","フランス","フランス","France","France.",["lesson:3","country"]),
            card("word-kyoushitsu","教室","きょうしつ","classroom","A classroom.",["lesson:4","school","place"],"教室に机があります。","きょうしつにつくえがあります。","There is a desk in the classroom."),
            card("word-tsukue","机","つくえ","desk","A desk.",["lesson:4","classroom","object"],"机があります。","つくえがあります。","There is a desk."),
            card("word-isu","いす","いす","chair","A chair.",["lesson:4","classroom","object"],"いすもあります。",None,"There is also a chair."),
            card("word-kaban","かばん","かばん","bag","A bag.",["lesson:4","classroom","object"],"かばんがあります。",None,"There is a bag."),
            card("word-hon","本","ほん","book","A book.",["lesson:4","classroom","object"],"本があります。","ほんがあります。","There is a book."),
            card("word-terebi","テレビ","テレビ","television; TV","A television.",["lesson:4","classroom","object"],"教室にテレビがありません。","きょうしつにテレビがありません。","There is no TV in the classroom."),
            card("word-e","絵","え","picture; drawing","A picture or drawing.",["lesson:4","classroom","object"],"教室に絵がありません。","きょうしつにえがありません。","There is no picture in the classroom."),
            card("word-sensei","先生","せんせい","teacher","A teacher.",["lesson:4","school","person"],"先生がいます。","せんせいがいます。","There is a teacher."),
            card("word-italian-person","イタリア人","イタリアじん","Italian person","A person from Italy.",["lesson:4","nationality","person"]),
            card("word-british-person","イギリス人","イギリスじん","British person","A person from Britain / the United Kingdom.",["lesson:4","nationality","person"]),
            card("word-australian-person","オーストラリア人","オーストラリアじん","Australian person","A person from Australia.",["lesson:4","nationality","person"]),
            card("word-nani","何","なに","what","The question word 'what'.",["lesson:4","question"])
          ]
          def gp(i,title,typ,structure,explanation,tags,examples):
              return {"id":i,"title":title,"type":typ,"input":["Noun"],"structure":structure,"explanation":explanation,"tags":base+tags,"examples":examples}
          c["grammar"] += [
            gp("grammar-shusshin-desu","～出身です — saying where someone is from","expression","Place + 出身 + です","Use 出身です to state someone's hometown or place of origin.",["lesson:3"],[{"sentence":"グアダラハラ出身です。","translation":"I'm from Guadalajara.","breakdown":["グアダラハラ","出身","です。"]},{"sentence":"東京出身じゃないです。","translation":"I'm not from Tokyo.","breakdown":["東京","出身","じゃないです。"]}]),
            gp("grammar-place-ni-arimasu","A は B に あります — locating a place","expression","A + は + B + に + あります","Use にあります to say where a place is located.",["lesson:3"],[{"sentence":"グアダラハラはメキシコにあります。","translation":"Guadalajara is in Mexico.","breakdown":["グアダラハラ","は","メキシコ","に","あります。"]},{"sentence":"東京は日本にあります。","translation":"Tokyo is in Japan.","breakdown":["東京","は","日本","に","あります。"]}]),
            gp("grammar-dokono-shusshin","どこの出身ですか — asking someone's origin","expression","Person + は + どこの + 出身 + ですか","Use どこの出身ですか to ask where someone is from.",["lesson:3"],[{"sentence":"マリアさんはどこの出身ですか。","translation":"Where is Maria from?","breakdown":["マリアさん","は","どこの","出身","ですか。"]}]),
            gp("grammar-place-ni-thing-ga-arimasu","Place に Thing が あります — saying something exists","expression","Place + に + Thing + が + あります","Use あります for inanimate things. ありません is the negative form; も can mean 'also'.",["lesson:4"],[{"sentence":"教室に机があります。","translation":"There is a desk in the classroom.","breakdown":["教室","に","机","が","あります。"]},{"sentence":"教室にテレビがありません。","translation":"There is no TV in the classroom.","breakdown":["教室","に","テレビ","が","ありません。"]}]),
            gp("grammar-place-ni-person-ga-imasu","Place に Person が います — saying someone exists/is present","expression","Place + に + Person + が + います","Use います for people and other animate beings. いません is the negative form; も can mean 'also'.",["lesson:4"],[{"sentence":"教室に学生がいます。","translation":"There is a student in the classroom.","breakdown":["教室","に","学生","が","います。"]},{"sentence":"教室に先生がいません。","translation":"There is no teacher in the classroom.","breakdown":["教室","に","先生","が","いません。"]}]),
            gp("grammar-nani-dare-ga","何が / 誰が — asking what or who is there","expression","Place + に + 何 / 誰 + が + あります / います + か","Use 何が with あります to ask what is present, and 誰が with います to ask who is present.",["lesson:4"],[{"sentence":"教室に何がありますか。","translation":"What is in the classroom?","breakdown":["教室","に","何","が","ありますか。"]},{"sentence":"教室に誰がいますか。","translation":"Who is in the classroom?","breakdown":["教室","に","誰","が","いますか。"]}])
          ]
          def sent(i,s,r,tr,tags,v=None,g=None):
              return {"id":i,"sentence":s,"sentence_furigana":r,"translation":tr,"breakdown":[],"vocabulary":v or [],"grammar":g or [],"tags":base+tags,"source":{"type":"manual","label":"Lesson "+tags[0].split(":")[1]}}
          G=lambda title,i:[{"title":title,"grammar_point_id":i}]
          V=lambda text,reading,meaning,i:[{"text":text,"reading":reading,"meaning":meaning,"card_id":i}]
          c["sentences"] += [
            sent("sentence-l3-origin-question","マリアさんはどこの出身ですか。","マリアさんはどこのしゅっしんですか。","Where is Maria from?",["lesson:3","question","origin"],V("出身","しゅっしん","place of origin","word-shusshin"),G("どこの出身ですか — asking someone's origin","grammar-dokono-shusshin")),
            sent("sentence-l3-guadalajara-origin","グアダラハラ出身です。","グアダラハラしゅっしんです。","I'm from Guadalajara.",["lesson:3","origin"],V("グアダラハラ","グアダラハラ","Guadalajara","word-guadalajara"),G("～出身です — saying where someone is from","grammar-shusshin-desu")),
            sent("sentence-l3-guadalajara-mexico","グアダラハラはメキシコにあります。","グアダラハラはメキシコにあります。","Guadalajara is in Mexico.",["lesson:3","location"],V("グアダラハラ","グアダラハラ","Guadalajara","word-guadalajara"),G("A は B に あります — locating a place","grammar-place-ni-arimasu")),
            sent("sentence-l3-anna-sydney","アンナさんはシドニー出身です。","アンナさんはシドニーしゅっしんです。","Anna is from Sydney.",["lesson:3","origin"],V("シドニー","シドニー","Sydney","word-sydney"),G("～出身です — saying where someone is from","grammar-shusshin-desu")),
            sent("sentence-l3-sydney-australia","シドニーはオーストラリアにあります。","シドニーはオーストラリアにあります。","Sydney is in Australia.",["lesson:3","location"],V("オーストラリア","オーストラリア","Australia","word-australia"),G("A は B に あります — locating a place","grammar-place-ni-arimasu")),
            sent("sentence-l3-tokyo-japan","東京は日本にあります。","とうきょうはにほんにあります。","Tokyo is in Japan.",["lesson:3","location"],V("東京","とうきょう","Tokyo","word-tokyo"),G("A は B に あります — locating a place","grammar-place-ni-arimasu")),
            sent("sentence-l3-mexico-origin-question","マリアさんはメキシコ出身ですか。","マリアさんはメキシコしゅっしんですか。","Is Maria from Mexico?",["lesson:3","question","origin"],V("出身","しゅっしん","place of origin","word-shusshin"),G("～出身です — saying where someone is from","grammar-shusshin-desu")),
            sent("sentence-l3-not-japan-origin","日本出身じゃないです。","にほんしゅっしんじゃないです。","I'm not from Japan.",["lesson:3","negative","origin"],V("出身","しゅっしん","place of origin","word-shusshin"),G("～出身です — saying where someone is from","grammar-shusshin-desu")),
            sent("sentence-l3-mexico-where","メキシコのどこですか。","メキシコのどこですか。","Where in Mexico?",["lesson:3","question","place"],V("どこ","どこ","where","word-doko")),
            sent("sentence-l3-paris-france","パリはフランスにあります。","パリはフランスにあります。","Paris is in France.",["lesson:3","location"],V("パリ","パリ","Paris","word-paris"),G("A は B に あります — locating a place","grammar-place-ni-arimasu")),
            sent("sentence-l3-rome-italy","ローマはイタリアにあります。","ローマはイタリアにあります。","Rome is in Italy.",["lesson:3","location"],V("ローマ","ローマ","Rome","word-rome"),G("A は B に あります — locating a place","grammar-place-ni-arimasu")),
            sent("sentence-l3-shanghai-china","上海は中国にあります。","しゃんはいはちゅうごくにあります。","Shanghai is in China.",["lesson:3","location"],V("上海","しゃんはい","Shanghai","word-shanghai"),G("A は B に あります — locating a place","grammar-place-ni-arimasu")),
            sent("sentence-l3-london-uk","ロンドンはイギリスにあります。","ロンドンはイギリスにあります。","London is in the United Kingdom.",["lesson:3","location"],V("ロンドン","ロンドン","London","word-london"),G("A は B に あります — locating a place","grammar-place-ni-arimasu")),
            sent("sentence-l4-desk-exists","教室に机があります。","きょうしつにつくえがあります。","There is a desk in the classroom.",["lesson:4","classroom","object"],V("机","つくえ","desk","word-tsukue"),G("Place に Thing が あります — saying something exists","grammar-place-ni-thing-ga-arimasu")),
            sent("sentence-l4-book-exists","教室に本があります。","きょうしつにほんがあります。","There is a book in the classroom.",["lesson:4","classroom","object"],V("本","ほん","book","word-hon"),G("Place に Thing が あります — saying something exists","grammar-place-ni-thing-ga-arimasu")),
            sent("sentence-l4-bag-also","教室にかばんもあります。","きょうしつにかばんもあります。","There is also a bag in the classroom.",["lesson:4","classroom","also"],V("かばん","かばん","bag","word-kaban"),G("Place に Thing が あります — saying something exists","grammar-place-ni-thing-ga-arimasu")),
            sent("sentence-l4-no-tv","教室にテレビがありません。","きょうしつにテレビがありません。","There is no TV in the classroom.",["lesson:4","classroom","negative"],V("テレビ","テレビ","TV","word-terebi"),G("Place に Thing が あります — saying something exists","grammar-place-ni-thing-ga-arimasu")),
            sent("sentence-l4-no-picture","教室に絵がありません。","きょうしつにえがありません。","There is no picture in the classroom.",["lesson:4","classroom","negative"],V("絵","え","picture","word-e"),G("Place に Thing が あります — saying something exists","grammar-place-ni-thing-ga-arimasu")),
            sent("sentence-l4-student-exists","教室に学生がいます。","きょうしつにがくせいがいます。","There is a student in the classroom.",["lesson:4","classroom","person"],V("学生","がくせい","student","word-gakusei"),G("Place に Person が います — saying someone exists/is present","grammar-place-ni-person-ga-imasu")),
            sent("sentence-l4-italian-student","教室にイタリア人の学生がいます。","きょうしつにイタリアじんのがくせいがいます。","There is an Italian student in the classroom.",["lesson:4","classroom","person"],V("イタリア人","イタリアじん","Italian person","word-italian-person"),G("Place に Person が います — saying someone exists/is present","grammar-place-ni-person-ga-imasu")),
            sent("sentence-l4-british-student","教室にイギリス人の学生もいます。","きょうしつにイギリスじんのがくせいもいます。","There is also a British student in the classroom.",["lesson:4","classroom","person","also"],V("イギリス人","イギリスじん","British person","word-british-person"),G("Place に Person が います — saying someone exists/is present","grammar-place-ni-person-ga-imasu")),
            sent("sentence-l4-teacher-also","教室に先生もいます。","きょうしつにせんせいもいます。","There is also a teacher in the classroom.",["lesson:4","classroom","person","also"],V("先生","せんせい","teacher","word-sensei"),G("Place に Person が います — saying someone exists/is present","grammar-place-ni-person-ga-imasu")),
            sent("sentence-l4-no-teacher","教室に先生がいません。","きょうしつにせんせいがいません。","There is no teacher in the classroom.",["lesson:4","classroom","negative","person"],V("先生","せんせい","teacher","word-sensei"),G("Place に Person が います — saying someone exists/is present","grammar-place-ni-person-ga-imasu")),
            sent("sentence-l4-no-australian-student","教室にオーストラリア人の学生がいません。","きょうしつにオーストラリアじんのがくせいがいません。","There is no Australian student in the classroom.",["lesson:4","classroom","negative","person"],V("オーストラリア人","オーストラリアじん","Australian person","word-australian-person"),G("Place に Person が います — saying someone exists/is present","grammar-place-ni-person-ga-imasu")),
            sent("sentence-l4-what-exists","教室に何がありますか。","きょうしつになにがありますか。","What is in the classroom?",["lesson:4","question","classroom"],V("何","なに","what","word-nani"),G("何が / 誰が — asking what or who is there","grammar-nani-dare-ga")),
            sent("sentence-l4-who-exists","教室に誰がいますか。","きょうしつにだれがいますか。","Who is in the classroom?",["lesson:4","question","classroom"],V("誰","だれ","who","word-dare"),G("何が / 誰が — asking what or who is there","grammar-nani-dare-ga"))
          ]
          c["version"]="1.1.0"
          assert (len(c["cards"]),len(c["grammar"]),len(c["sentences"]))==(52,14,51)
          for domain in ("cards","grammar","sentences"):
              ids=[x["id"] for x in c[domain]]; assert len(ids)==len(set(ids))
              for x in c[domain]: assert "course:japanese" in x.get("tags",[]) and "jlpt:N5" in x.get("tags",[])
              assert all(any(f"lesson:{n}" in x.get("tags",[]) for x in c[domain]) for n in range(1,5))
          card_ids={x["id"] for x in c["cards"]}; gram_ids={x["id"] for x in c["grammar"]}
          for s in c["sentences"]:
              for v in s.get("vocabulary",[]): assert not v.get("card_id") or v["card_id"] in card_ids
              for g in s.get("grammar",[]): assert not g.get("grammar_point_id") or g["grammar_point_id"] in gram_ids
          with open(p,"w",encoding="utf-8") as f: json.dump(c,f,ensure_ascii=False,indent=2); f.write("\n")
          idx="courses/index.json"
          with open(idx,encoding="utf-8") as f: catalog=json.load(f)
          for e in catalog["courses"]:
              if e["id"]=="japanese-jlpt-n5":
                  e.update(description="JLPT N5 course deck containing Japanese Lessons 1–4, organized by structured lesson tags for focused study.",topic="Introductions, friends, origins & classroom",version="1.1.0",tags=["JLPT N5","Lesson 1","Lesson 2","Lesson 3","Lesson 4","beginner"],counts={"cards":52,"grammar":14,"sentences":51})
          with open(idx,"w",encoding="utf-8") as f: json.dump(catalog,f,ensure_ascii=False,indent=2); f.write("\n")
          PY
      - name: Commit generated content and remove staging transport
        run: |
          rm -rf .tmp .github/workflows/assemble-n5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Japanese N5 Lessons 3 and 4"
          git push origin HEAD:feature/marble-courses

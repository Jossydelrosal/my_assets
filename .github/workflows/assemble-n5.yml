name: Assemble N5 course

on:
  push:
    branches:
      - feature/marble-courses
    paths:
      - .tmp/n5-final-ready

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/marble-courses
      - name: Assemble and validate Japanese N5 Lessons 1-4
        run: |
          python - <<'PY'
          import base64, json, string
          p1 = open(".tmp/course-part1.b64", encoding="utf-8").read().strip()
          p2 = open(".tmp/course-part2.b64", encoding="utf-8").read().strip()
          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + "+/"
          valid = []
          for inserted in [""] + list(alphabet):
              encoded = p1 + inserted + p2
              encoded += "=" * (-len(encoded) % 4)
              try:
                  payload = base64.b64decode(encoded, validate=True).decode("utf-8")
                  course = json.loads(payload)
                  if course.get("schema_version") != 1 or course.get("course_id") != "japanese-jlpt-n5" or course.get("version") != "1.1.0":
                      continue
                  if (len(course.get("cards", [])), len(course.get("grammar", [])), len(course.get("sentences", []))) != (52, 14, 51):
                      continue
                  valid.append((inserted, payload, course))
              except Exception:
                  pass
          assert len(valid) == 1, f"Expected exactly one valid reconstruction, got {len(valid)}"
          inserted, payload, course = valid[0]
          print(f"Recovered missing base64 character: {inserted!r}")
          for domain in ("cards", "grammar", "sentences"):
              ids = [item["id"] for item in course[domain]]
              assert len(ids) == len(set(ids)), f"Duplicate IDs in {domain}"
              scopes = {n: 0 for n in range(1, 5)}
              for item in course[domain]:
                  tags = item.get("tags", [])
                  assert "course:japanese" in tags and "jlpt:N5" in tags
                  for n in scopes:
                      scopes[n] += f"lesson:{n}" in tags
              assert all(scopes.values()), f"Missing lesson scope in {domain}: {scopes}"
          card_ids = {item["id"] for item in course["cards"]}
          grammar_ids = {item["id"] for item in course["grammar"]}
          for sentence in course["sentences"]:
              for vocab in sentence.get("vocabulary", []):
                  if vocab.get("card_id"):
                      assert vocab["card_id"] in card_ids
              for grammar in sentence.get("grammar", []):
                  if grammar.get("grammar_point_id"):
                      assert grammar["grammar_point_id"] in grammar_ids
          with open("courses/japanese-jlpt-n5/course.json", "w", encoding="utf-8") as f:
              f.write(payload)
          index_path = "courses/index.json"
          with open(index_path, encoding="utf-8") as f:
              catalog = json.load(f)
          found = False
          for entry in catalog["courses"]:
              if entry["id"] == "japanese-jlpt-n5":
                  found = True
                  entry["description"] = "JLPT N5 course deck containing Japanese Lessons 1–4, organized by structured lesson tags for focused study."
                  entry["topic"] = "Introductions, friends, origins & classroom"
                  entry["version"] = "1.1.0"
                  entry["tags"] = ["JLPT N5", "Lesson 1", "Lesson 2", "Lesson 3", "Lesson 4", "beginner"]
                  entry["counts"] = {"cards": 52, "grammar": 14, "sentences": 51}
          assert found
          with open(index_path, "w", encoding="utf-8") as f:
              json.dump(catalog, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
      - name: Commit generated content and remove staging transport
        run: |
          rm -rf .tmp .github/workflows/assemble-n5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Japanese N5 Lessons 3 and 4"
          git push origin HEAD:feature/marble-courses

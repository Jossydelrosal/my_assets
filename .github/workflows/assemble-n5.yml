name: Assemble N5 course

on:
  push:
    branches:
      - feature/marble-courses

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/marble-courses
      - name: Write combined N5 course and catalog metadata
        env:
          N5_GZIP_BASE64: >-
            
        run: |
          python - <<'PY'
          import base64, gzip, json, os
          payload = gzip.decompress(base64.b64decode(os.environ["N5_GZIP_BASE64"])).decode("utf-8")
          with open("courses/japanese-jlpt-n5/course.json", "w", encoding="utf-8") as f:
              f.write(payload)
          path = "courses/index.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          for course in data["courses"]:
              if course["id"] == "japanese-jlpt-n5":
                  course["description"] = "JLPT N5 course deck containing Japanese Lessons 1–4, organized by structured lesson tags for focused study."
                  course["topic"] = "Introductions, friends, origins & classroom"
                  course["version"] = "1.1.0"
                  course["tags"] = ["JLPT N5", "Lesson 1", "Lesson 2", "Lesson 3", "Lesson 4", "beginner"]
                  course["counts"] = {"cards": 52, "grammar": 14, "sentences": 51}
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
      - name: Remove temporary workflow and commit generated content
        run: |
          rm .github/workflows/assemble-n5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses/japanese-jlpt-n5/course.json courses/index.json .github/workflows/assemble-n5.yml
          git commit -m "Add Japanese N5 Lessons 3 and 4"
          git push origin HEAD:feature/marble-courses
